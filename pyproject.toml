[project]
name = "job-match-ai"
version = "0.1.0"
description = "AI-powered CV and job posting match analysis"
readme = "README.md"
authors = [
    { name = "Henna Piira" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.22.0",
    "pydantic>=2.13.5",
    "pypdf>=6.18.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[project.scripts]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
